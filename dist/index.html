<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <script src="theme.js?v=2"></script>
  <meta name="description" content="시간을 잠시 멈추고, 바늘을 돌려 보세요. 간단한 아날로그 시계 시뮬레이터.">
  <title>Clock Simulator</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header><span class="brand">CLOCK SIMULATOR<span class="brand-dot">.</span></span><div class="header-actions"><button id="theme" class="theme" aria-label="다크 모드" aria-pressed="false" title="다크 모드"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></button><button id="fullscreen" class="fullscreen" aria-keyshortcuts="f" aria-label="전체화면" title="전체화면 (F)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></header>
  <main>
    <div class="clock-wrap">
      <svg id="clock" viewBox="0 0 600 600" role="group" aria-label="아날로그 시계">
        <circle class="face" cx="300" cy="300" r="292"/>
        <g id="marks"></g><g id="numbers"></g>
        <text x="300" y="400" class="face-brand" text-anchor="middle">MAKE TIME YOURS</text>
        <g class="hand" id="hour" role="slider" tabindex="0" aria-label="시침" aria-valuemin="0" aria-valuemax="23"><line class="hit" x1="300" y1="315" x2="300" y2="155"/><line class="hour-line" x1="300" y1="310" x2="300" y2="155"/></g>
        <g class="hand" id="minute" role="slider" tabindex="0" aria-label="분침" aria-valuemin="0" aria-valuemax="59"><line class="hit" x1="300" y1="320" x2="300" y2="89"/><line class="minute-line" x1="300" y1="315" x2="300" y2="89"/></g>
        <g class="hand" id="second" role="slider" tabindex="0" aria-label="초침" aria-valuemin="0" aria-valuemax="59"><line class="hit" x1="300" y1="343" x2="300" y2="66"/><line class="second-line" x1="300" y1="343" x2="300" y2="66"/></g>
        <circle class="pin" cx="300" cy="300" r="9"/><circle class="pin-center" cx="300" cy="300" r="3"/>
      </svg>
    </div>
    <div class="controls">
      <label class="second-mode">무브먼트
        <select id="second-mode">
          <option value="1">데드비트 (초당 1회)</option>
          <option value="6">3Hz (초당 6회)</option>
          <option value="8">4Hz (초당 8회)</option>
          <option value="0" selected>연속</option>
        </select>
      </label>
      <label class="time-label"><span class="sr-only">시간 입력 (시:분:초)</span><input id="time" type="time" step="1" aria-label="시간 입력 (시:분:초)"></label>
      <div class="buttons">
        <button id="toggle" class="toggle" aria-keyshortcuts="Space" title="재생 / 정지 (Space)" aria-label="정지"><svg id="toggle-icon" width="17" height="17" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3h3v14H5zm7 0h3v14h-3z"/></svg><span id="toggle-label">정지</span></button>
        <button id="realtime" class="realtime">실제 시간으로 이동</button>
      </div>
      <p id="hint">정지하면 바늘을 돌리거나 시간을 입력할 수 있어요.</p>
    </div>
  </main>
  <footer><span>시간을, 내 마음대로.</span><a href="https://github.com/lakekimhandsome/clock-simulator" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer>
  <p id="message" class="sr-only" role="status"></p>
  <script type="module" src="app.js?v=7"></script>
</body>
</html>
